[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amrutam-telemedicine"
version = "0.1.0"
description = "Production-grade telemedicine backend for Amrutam"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}

authors = [
    {name = "Amrutam Engineering"}
]

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.30,<1.0",
    "alembic>=1.15,<2.0",
    "pydantic>=2.10,<3.0",
    "email-validator>=2.2,<3.0",
    "pydantic-settings>=2.8,<3.0",
    "PyJWT>=2.10,<3.0",
    "pwdlib[argon2]>=0.2,<1.0",
    "cryptography>=50,<51",
    "redis>=6.0,<8.0",
    "celery[redis]>=5.4,<6.0",
    "tenacity>=9.0,<10.0",
    "pyotp>=2.9,<3",
    "slowapi>=0.1.9,<1.0",
    "structlog>=25.1,<26.0",
    "httpx>=0.28,<1.0",
    "prometheus-fastapi-instrumentator>=8.1,<9.0",
    "opentelemetry-api>=1.30,<2.0",
    "opentelemetry-sdk>=1.30,<2.0",
    "opentelemetry-instrumentation-fastapi>=0.51b0,<1.0",
    "opentelemetry-instrumentation-sqlalchemy>=0.51b0,<1.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.30,<2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "pytest-asyncio>=1.4,<2",
    "pytest-cov>=6.0,<7.0",
    "ruff>=0.9,<1.0",
    "mypy>=1.15,<2.0",
    "bandit>=1.8,<2.0",
    "pip-audit>=2.7,<3.0"
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
